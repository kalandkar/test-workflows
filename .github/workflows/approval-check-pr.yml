name: Approval Check PR

on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  pull-requests: write
  issues: read

jobs:
  check-pr-approval:
    name: Verify Approved External Contributor & Linked Issue
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/CONTRIBUTORS.td

      - name: Validate Contributor in CONTRIBUTORS.td & Linked Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner.toLowerCase();
            const pr = context.payload.pull_request;
            const author = pr.user.login.toLowerCase();

            // Defense-in-depth: Repository owner always has unrestricted PR rights
            if (author === owner) {
              return;
            }

            const rawLines = fs.existsSync(".github/CONTRIBUTORS.td")
              ? fs.readFileSync(".github/CONTRIBUTORS.td", "utf8").split("\n")
              : [];

            const approved = new Set();
            const blocked = new Set();

            for (const line of rawLines) {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith("#")) continue;

              const token = trimmed.split(/\s+/)[0].toLowerCase();
              const isBlocked = token.startsWith("-");
              const unsigned = isBlocked ? token.slice(1) : token;

              let platform = "github";
              let username = unsigned;
              if (unsigned.includes(":")) {
                [platform, username] = unsigned.split(":", 2);
              }
              if (platform !== "github" || !username || username === owner) continue;

              if (isBlocked) blocked.add(username);
              else approved.add(username);
            }

            const issueMatch = (pr.body || "").match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);

            if (blocked.has(author) || !approved.has(author) || !issueMatch) {
              const reason = blocked.has(author)
                ? "Your account has been restricted from contributing due to repository policy violations."
                : !approved.has(author)
                ? "First-time external contributors must be approved via **GitHub Discussions (Approval Request)** (`!approve`) and listed in `.github/CONTRIBUTORS.td` before opening a Pull Request."
                : "Every external Pull Request must link an open, maintainer-created Issue using `Fixes #<number>`.";

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `👋 Thanks for your interest in **ERBoard**!\n\n${reason}\n\nPlease review our [Contributing Guidelines](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md) and [AI Usage Policy](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/AI_POLICY.md). This Pull Request has been closed automatically.`
              });
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: "closed"
              });
              core.setFailed(reason);
            }